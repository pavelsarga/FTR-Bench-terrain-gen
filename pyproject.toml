[project]
name = "ftr-terrain-generation"
version = "0.1.0"
description = "Procedural generator for FTR-Benchmark terrain courses (usd/map/yaml/json)"
requires-python = ">=3.10"
dependencies = [
    "usd-core",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["ftr_terrain_gen*"]
